<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palingo Ventures LLC | We Buy Houses Cash Fast</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkbox-section {
            margin-top: 20px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .checkbox-container input {
            margin-top: 5px;
            margin-right: 10px;
            cursor: pointer;
        }
        .checkbox-container label {
            font-size: 13px;
            line-height: 1.4;
            color: #333;
            cursor: pointer;
        }
        .checkbox-container a {
            color: #007bff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Palingo Ventures LLC</h1>
        <p>We Buy Houses Cash – Any Condition, Fast Close</p>
    </header>

    <main>
        <section id="offer-form">
            <h2>Get Your Free Cash Offer</h2>
            <form action="#" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="tel" name="phone" placeholder="Phone Number" required>
                <input type="text" name="address" placeholder="Property Address" required>

                <div class="checkbox-section">
                    <div class="checkbox-container">
                        <input type="checkbox" id="transactional_sms" name="transactional_sms">
                        <label for="transactional_sms">
                            By checking, you are allowing to receive <strong>transactional/informational</strong> SMS communications regarding account notifications, customer care, etc, from Palingo Ventures LLC. Messages frequency may vary. Data rates may apply, reply STOP to opt-out.
                        </label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="marketing_sms" name="marketing_sms">
                        <label for="marketing_sms">
                            By checking, you are allowing to receive <strong>promotional/marketing</strong> SMS communications from Palingo Ventures LLC. Frequency may vary, Data rates may apply, reply HELP for help or STOP to opt-out.
                        </label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="terms_accept" name="terms_accept" required>
                        <label for="terms_accept">
                            By checking, I accept <a href="privacy.html">Terms of Service & Privacy Policy</a>.
                        </label>
                    </div>
                </div>
                <button type="submit">Submit & Get Offer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Palingo Ventures LLC. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms & Conditions</a></p>
    </footer>
</body>
</html>
